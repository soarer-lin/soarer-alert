services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: soarer-alert-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-superbiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-soarer_alert}
    volumes:
      - soarer-alert-prod-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-superbiz} -d ${POSTGRES_DB:-soarer_alert}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - soarer-alert-prod

  redis:
    image: redis:7.2-alpine
    container_name: soarer-alert-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - soarer-alert-prod-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - soarer-alert-prod

  rustfs:
    image: rustfs/rustfs:latest
    container_name: soarer-alert-rustfs
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - soarer-alert-prod-rustfs-data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/nc", "-z", "localhost", "9000"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - soarer-alert-prod

  cls-mcp:
    image: node:22-alpine
    container_name: soarer-alert-cls-mcp
    command: ["npx", "-y", "cls-mcp-server@latest"]
    environment:
      TRANSPORT: sse
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:?TENCENTCLOUD_SECRET_ID is required}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:?TENCENTCLOUD_SECRET_KEY is required}
      TENCENTCLOUD_API_BASE_HOST: ${TENCENTCLOUD_API_BASE_HOST:-tencentcloudapi.com}
      TENCENTCLOUD_REGION: ${TENCENTCLOUD_REGION:-ap-guangzhou}
      MAX_LENGTH: ${CLS_MCP_MAX_LENGTH:-15000}
      PORT: "3000"
      TZ: ${TZ:-Asia/Shanghai}
    restart: unless-stopped
    networks:
      - soarer-alert-prod

  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: soarer-alert-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./docker/prometheus/prometheus-prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/targets:/etc/prometheus/targets:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - soarer-alert-prod-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - soarer-alert-prod

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: soarer-alert-service:prod
    container_name: soarer-alert-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 9900
      MANAGEMENT_SERVER_PORT: 9911
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY is required}
      DASHSCOPE_CHAT_MODEL: ${DASHSCOPE_CHAT_MODEL:-qwen3.7-flash}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v3}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-soarer_alert}
      POSTGRES_USER: ${POSTGRES_USER:-superbiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-soarer-alert}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_AUTO_CREATE_BUCKET: ${RUSTFS_AUTO_CREATE_BUCKET:-true}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:?AUTH_ADMIN_USERNAME is required}
      AUTH_ADMIN_INITIAL_PASSWORD: ${AUTH_ADMIN_INITIAL_PASSWORD:?AUTH_ADMIN_INITIAL_PASSWORD is required}
      AUTH_SESSION_TIMEOUT_MINUTES: ${AUTH_SESSION_TIMEOUT_MINUTES:-720}
      AUTH_MAX_FAILED_ATTEMPTS: ${AUTH_MAX_FAILED_ATTEMPTS:-5}
      AUTH_LOCK_DURATION_MINUTES: ${AUTH_LOCK_DURATION_MINUTES:-15}
      AUTH_SESSION_COOKIE_SECURE: ${AUTH_SESSION_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:9900,http://127.0.0.1:9900}
      MCP_CLIENT_ENABLED: "true"
      CLS_MCP_URL: http://cls-mcp:3000
      CLS_MCP_SSE_ENDPOINT: /sse
      PROMETHEUS_BASE_URL: http://prometheus:9090
      PROMETHEUS_MOCK_ENABLED: "false"
      CLS_MOCK_ENABLED: "false"
      CLS_UPLOAD_ENABLED: "true"
      CLS_UPLOAD_ENDPOINT: ${CLS_UPLOAD_ENDPOINT:-}
      CLS_WRITER_SECRET_ID: ${CLS_WRITER_SECRET_ID:?CLS_WRITER_SECRET_ID is required}
      CLS_WRITER_SECRET_KEY: ${CLS_WRITER_SECRET_KEY:?CLS_WRITER_SECRET_KEY is required}
      CLS_SERVICE_NAME: ${CLS_SERVICE_NAME:-soarer-alert-agent}
      CLS_ENVIRONMENT: ${CLS_ENVIRONMENT:-prod}
      CLS_HOST_NAME: ${CLS_HOST_NAME:-}
      CLS_SERVICE_IP: ${CLS_SERVICE_IP:-}
      CLS_APP_TOPIC_ID: ${CLS_APP_TOPIC_ID:?CLS_APP_TOPIC_ID is required}
      CLS_HOST_TOPIC_ID: ${CLS_HOST_TOPIC_ID:?CLS_HOST_TOPIC_ID is required}
      CLS_MIDDLEWARE_TOPIC_ID: ${CLS_MIDDLEWARE_TOPIC_ID:?CLS_MIDDLEWARE_TOPIC_ID is required}
      CLS_DIAGNOSIS_TOPIC_ID: ${CLS_DIAGNOSIS_TOPIC_ID:?CLS_DIAGNOSIS_TOPIC_ID is required}
    volumes:
      - soarer-alert-prod-app-uploads:/app/uploads
      - soarer-alert-prod-app-logs:/app/logs
    ports:
      - "${APP_PORT:-9900}:9900"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      cls-mcp:
        condition: service_started
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - soarer-alert-prod

volumes:
  soarer-alert-prod-postgres-data:
  soarer-alert-prod-redis-data:
  soarer-alert-prod-rustfs-data:
  soarer-alert-prod-app-uploads:
  soarer-alert-prod-app-logs:
  soarer-alert-prod-prometheus-data:

networks:
  soarer-alert-prod:
    name: soarer-alert-prod
