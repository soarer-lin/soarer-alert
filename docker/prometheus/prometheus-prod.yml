global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: soarer-alert-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - soarer-alert-app:9911
        labels:
          service: soarer-alert-service

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node-exporter
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/node-*.yml
        refresh_interval: 30s

  - job_name: windows-exporter
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/windows-*.yml
        refresh_interval: 30s
