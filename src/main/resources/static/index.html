<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoarerAlertAgent</title>
    <link rel="stylesheet" href="styles.css?v=20260914-5">
    <!-- Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- 代码高亮库（可选） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="theme.css?v=20260914-5">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">SoarerAlertAgent</h2>
            </div>

            <div class="sidebar-content">
                <button class="new-chat-btn" id="newChatBtn">
                    <i data-lucide="plus" aria-hidden="true"></i>
                    <span>新建对话</span>
                </button>

                <a class="new-chat-btn ops-entry-link" href="/ops.html" data-auth-ops>
                    <i data-lucide="activity" aria-hidden="true"></i>
                    <span>运维工作台</span>
                </a>
                
                <div class="chat-history-section">
                    <div class="history-header">
                        <span>近期对话</span>
                    </div>
                    <div class="chat-history-list" id="chatHistoryList">
                        <!-- 历史对话列表将在这里动态生成 -->
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <strong data-auth-name>加载中</strong>
                    <span data-auth-role></span>
                </div>
                <a class="sidebar-footer-link hidden" href="/account.html" data-auth-account>
                    <i data-lucide="user-cog" aria-hidden="true"></i>
                    <span>账号设置</span>
                </a>
                <a class="sidebar-footer-link hidden" href="/admin.html" data-auth-admin>
                    <i data-lucide="users" aria-hidden="true"></i>
                    <span>用户管理</span>
                </a>
                <button class="sidebar-footer-link hidden" type="button" data-auth-logout>
                    <i data-lucide="log-out" aria-hidden="true"></i>
                    <span>退出登录</span>
                </button>
            </div>
        </aside>

        <!-- 主内容区域 -->
        <main class="main-content">
            <button class="ai-ops-top-btn" id="aiOpsSidebarBtn" data-auth-ops>
                <i data-lucide="layers" aria-hidden="true"></i>
                <span>AI Ops</span>
            </button>
            <div class="chat-container">
                <div class="welcome-greeting" id="welcomeGreeting">
                    <p>你好！我是 SoarerAlert 值守小助手</p>
                </div>
                <div class="chat-messages" id="chatMessages">
                </div>
                
                <div class="chat-input-container">
                    <div class="input-group-wrapper">
                        <div class="input-wrapper">
                            <input type="text" id="messageInput" placeholder="问问SoarerAlert值守助手" maxlength="1000" class="message-input">
                            <div class="input-bottom-bar">
                                <div class="tools-btn-wrapper">
                                    <button class="tools-btn" id="toolsBtn" title="更多选项">
                                        <i class="tools-icon" data-lucide="more-horizontal" aria-hidden="true"></i>
                                    </button>
                                    <div class="tools-menu" id="toolsMenu">
                                        <div class="tools-menu-item" id="uploadFileItem">
                                            <i data-lucide="paperclip" aria-hidden="true"></i>
                                            <span>上传文件</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="right-actions">
                                    <div class="mode-selector-wrapper">
                                        <button class="mode-selector-btn" id="modeSelectorBtn">
                                            <span id="currentModeText">流式</span>
                                            <i class="dropdown-arrow" data-lucide="chevron-down" aria-hidden="true"></i>
                                        </button>
                                        <div class="mode-dropdown" id="modeDropdown">
                                            <div class="dropdown-header">选择对话方式</div>
                                            <div class="dropdown-item" data-mode="quick">
                                                <div class="dropdown-item-main">
                                                    <span>快速</span>
                                                    <span class="badge-new">新</span>
                                                </div>
                                                <div class="dropdown-item-sub">快速对话</div>
                                            </div>
                                            <div class="dropdown-item active" data-mode="stream">
                                                <div class="dropdown-item-main">
                                                    <span>流式</span>
                                                </div>
                                                <div class="dropdown-item-sub">流式对话</div>
                                            </div>
                                        </div>
                                    </div>
                                    <button class="send-btn-circle" id="sendButton" title="发送">
                                        <i data-lucide="arrow-up" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <input type="file" id="fileInput" accept=".txt,.md,.markdown,.pdf,.doc,.docx" style="display: none;">
                </div>
            </div>
        </main>
    </div>

    <!-- 加载遮罩层 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">智能运维分析中，请稍候...</div>
            <div class="loading-subtext">后端正在处理，请耐心等待</div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="app.js?v=20260914-5"></script>
</body>
</html>
