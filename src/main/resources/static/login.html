<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 SoarerAlertAgent</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="theme.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
</head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-card">
        <div class="auth-brand">
            <h1 class="auth-brand-title">SoarerAlertAgent</h1>
            <p>智能告警排查平台</p>
        </div>

        <form id="loginForm" autocomplete="on">
            <label class="auth-field">
                <span>用户名</span>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            </label>
            <label class="auth-field">
                <span>密码</span>
                <div class="auth-password">
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                    <button type="button" class="auth-icon-button" data-password-toggle="#password"
                            aria-label="显示密码" aria-pressed="false">
                        <span class="auth-icon" data-icon-show><i data-lucide="eye"></i></span>
                        <span class="auth-icon hidden" data-icon-hide><i data-lucide="eye-off"></i></span>
                    </button>
                </div>
            </label>
            <p class="auth-alert error hidden" id="loginError"></p>
            <button class="auth-button primary" id="loginButton" type="submit">
                <i data-lucide="log-in"></i>
                <span>登录</span>
            </button>
            <div class="auth-switch-row">
                <span id="loginModeHint">还没有账号？请联系管理员获取账号</span>
            </div>
        </form>
    </section>
</main>
<script src="password-visibility.js"></script>
<script src="login.js"></script>
</body>
</html>
