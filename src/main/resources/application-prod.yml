# 生产环境配置，部署时必须提供安全的外部配置。
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:soarer_alert}
    username: ${POSTGRES_USER:superbiz}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
    mcp:
      client:
        enabled: ${MCP_CLIENT_ENABLED:true}
        name: ${MCP_CLIENT_NAME:tencent-cls}
        version: ${MCP_CLIENT_VERSION:1.0.0}
        request-timeout: ${MCP_CLIENT_REQUEST_TIMEOUT:60s}
        type: ${MCP_CLIENT_TYPE:ASYNC}
        sse:
          connections:
            tencent-cls:
              url: ${CLS_MCP_URL}
              sse-endpoint: ${CLS_MCP_SSE_ENDPOINT}

server:
  port: ${SERVER_PORT:9900}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9911}
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  structured:
    format:
      console: logstash
      file: logstash
  file:
    name: ${LOG_FILE:logs/soarer-alert-service.log}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:50MB}
      max-history: ${LOG_MAX_HISTORY:14}

file:
  upload:
    path: ${FILE_UPLOAD_PATH:./uploads}

dashscope:
  api:
    key: ${DASHSCOPE_API_KEY}
  chat:
    model: ${DASHSCOPE_CHAT_MODEL:qwen3.7-flash}
    base-url: ${DASHSCOPE_CHAT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    completions-path: ${DASHSCOPE_CHAT_COMPLETIONS_PATH:/chat/completions}
    enable-thinking: ${DASHSCOPE_CHAT_ENABLE_THINKING:false}
  embedding:
    model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}

prometheus:
  base-url: ${PROMETHEUS_BASE_URL:http://localhost:9090}
  timeout: ${PROMETHEUS_TIMEOUT:10}
  mock-enabled: false

cls:
  mock-enabled: false

app:
  auth:
    admin-username: ${AUTH_ADMIN_USERNAME}
    admin-initial-password: ${AUTH_ADMIN_INITIAL_PASSWORD}
    session-timeout-minutes: ${AUTH_SESSION_TIMEOUT_MINUTES:720}
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lock-duration-minutes: ${AUTH_LOCK_DURATION_MINUTES:15}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:9900,http://127.0.0.1:9900}
  storage:
    endpoint: ${RUSTFS_ENDPOINT}
    access-key: ${RUSTFS_ACCESS_KEY}
    secret-key: ${RUSTFS_SECRET_KEY}
    bucket: ${RUSTFS_BUCKET}
    region: ${RUSTFS_REGION:us-east-1}
    api-call-timeout: ${RUSTFS_API_CALL_TIMEOUT:60s}
    api-call-attempt-timeout: ${RUSTFS_API_CALL_ATTEMPT_TIMEOUT:20s}
    auto-create-bucket: ${RUSTFS_AUTO_CREATE_BUCKET:true}
