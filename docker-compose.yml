services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: soarer-alert-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-superbiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superbiz_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-soarer_alert}
    volumes:
      - soarer-alert-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-superbiz} -d ${POSTGRES_DB:-soarer_alert}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - soarer-alert-infra

  redis:
    image: redis:7.2-alpine
    container_name: soarer-alert-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - soarer-alert-redis-data:/data
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - soarer-alert-infra

  rustfs:
    image: rustfs/rustfs:latest
    container_name: soarer-alert-rustfs
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - soarer-alert-rustfs-data:/data
    ports:
      - "${RUSTFS_PORT:-19000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD", "/usr/bin/nc", "-z", "localhost", "9000"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - soarer-alert-infra

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: soarer-alert-service:local
    container_name: soarer-alert-app
    profiles:
      - app
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 9900
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY is required}
      DASHSCOPE_CHAT_MODEL: ${DASHSCOPE_CHAT_MODEL:-qwen3.7-flash}
      DASHSCOPE_CHAT_BASE_URL: ${DASHSCOPE_CHAT_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_CHAT_COMPLETIONS_PATH: ${DASHSCOPE_CHAT_COMPLETIONS_PATH:-/chat/completions}
      DASHSCOPE_CHAT_ENABLE_THINKING: ${DASHSCOPE_CHAT_ENABLE_THINKING:-false}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v3}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:?AUTH_ADMIN_USERNAME is required}
      AUTH_ADMIN_INITIAL_PASSWORD: ${AUTH_ADMIN_INITIAL_PASSWORD:?AUTH_ADMIN_INITIAL_PASSWORD is required}
      AUTH_SESSION_TIMEOUT_MINUTES: ${AUTH_SESSION_TIMEOUT_MINUTES:-720}
      AUTH_MAX_FAILED_ATTEMPTS: ${AUTH_MAX_FAILED_ATTEMPTS:-5}
      AUTH_LOCK_DURATION_MINUTES: ${AUTH_LOCK_DURATION_MINUTES:-15}
      AUTH_SESSION_COOKIE_SECURE: ${AUTH_SESSION_COOKIE_SECURE:-false}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-soarer_alert}
      POSTGRES_USER: ${POSTGRES_USER:-superbiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superbiz_local_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-soarer-alert}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_AUTO_CREATE_BUCKET: ${RUSTFS_AUTO_CREATE_BUCKET:-true}
      MCP_CLIENT_ENABLED: ${MCP_CLIENT_ENABLED:-false}
      MCP_CLIENT_NAME: ${MCP_CLIENT_NAME:-tencent-cls}
      MCP_CLIENT_VERSION: ${MCP_CLIENT_VERSION:-1.0.0}
      MCP_CLIENT_REQUEST_TIMEOUT: ${MCP_CLIENT_REQUEST_TIMEOUT:-60s}
      MCP_CLIENT_TYPE: ${MCP_CLIENT_TYPE:-ASYNC}
      CLS_MCP_URL: ${CLS_MCP_URL:-http://cls-mcp:3000}
      CLS_MCP_SSE_ENDPOINT: ${CLS_MCP_SSE_ENDPOINT:-/sse}
      PROMETHEUS_MOCK_ENABLED: ${PROMETHEUS_MOCK_ENABLED:-true}
      PROMETHEUS_BASE_URL: http://prometheus:9090
      CLS_MOCK_ENABLED: ${CLS_MOCK_ENABLED:-true}
      TENCENTCLOUD_REGION: ${TENCENTCLOUD_REGION:-ap-guangzhou}
      CLS_UPLOAD_ENABLED: ${CLS_UPLOAD_ENABLED:-false}
      CLS_UPLOAD_ENDPOINT: ${CLS_UPLOAD_ENDPOINT:-}
      CLS_WRITER_SECRET_ID: ${CLS_WRITER_SECRET_ID:-}
      CLS_WRITER_SECRET_KEY: ${CLS_WRITER_SECRET_KEY:-}
      CLS_SERVICE_NAME: ${CLS_SERVICE_NAME:-soarer-alert-agent}
      CLS_ENVIRONMENT: ${CLS_ENVIRONMENT:-local}
      CLS_HOST_NAME: ${CLS_HOST_NAME:-}
      CLS_SERVICE_IP: ${CLS_SERVICE_IP:-}
      CLS_APP_TOPIC_ID: ${CLS_APP_TOPIC_ID:-}
      CLS_DIAGNOSIS_TOPIC_ID: ${CLS_DIAGNOSIS_TOPIC_ID:-}
    volumes:
      - soarer-alert-app-uploads:/app/uploads
      - soarer-alert-app-logs:/app/logs
    ports:
      - "${APP_PORT:-9900}:9900"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/healthcheck", "HealthCheck"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped
    networks:
      - soarer-alert-infra

  cls-mcp:
    image: node:22-alpine
    container_name: soarer-alert-cls-mcp
    profiles:
      - mcp
    command: ["npx", "-y", "cls-mcp-server@latest"]
    environment:
      TRANSPORT: sse
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:-}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:-}
      TENCENTCLOUD_API_BASE_HOST: ${TENCENTCLOUD_API_BASE_HOST:-tencentcloudapi.com}
      TENCENTCLOUD_REGION: ${TENCENTCLOUD_REGION:-ap-guangzhou}
      MAX_LENGTH: ${CLS_MCP_MAX_LENGTH:-15000}
      PORT: "3000"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${CLS_MCP_PORT:-13000}:3000"
    restart: unless-stopped
    networks:
      - soarer-alert-infra

  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: soarer-alert-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/targets:/etc/prometheus/targets:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - soarer-alert-prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - soarer-alert-infra

  loki:
    image: grafana/loki:3.0.0
    container_name: soarer-alert-loki
    profiles:
      - observability
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/loki.yml:ro
      - soarer-alert-loki-data:/loki
    ports:
      - "${LOKI_PORT:-13100}:3100"
    restart: unless-stopped
    networks:
      - soarer-alert-infra

  promtail:
    image: grafana/promtail:3.0.0
    container_name: soarer-alert-promtail
    profiles:
      - observability
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./docker/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - soarer-alert-infra

volumes:
  soarer-alert-postgres-data:
    name: soarer-alert-postgres-data
  soarer-alert-redis-data:
    name: soarer-alert-redis-data
  soarer-alert-rustfs-data:
    name: soarer-alert-rustfs-data
  soarer-alert-app-uploads:
    name: soarer-alert-app-uploads
  soarer-alert-app-logs:
    name: soarer-alert-app-logs
  soarer-alert-prometheus-data:
    name: soarer-alert-prometheus-data
  soarer-alert-loki-data:
    name: soarer-alert-loki-data

networks:
  soarer-alert-infra:
    name: soarer-alert-infra
